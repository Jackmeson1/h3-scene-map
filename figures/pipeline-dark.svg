<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" width="720" height="196" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="720" height="196" fill="#1a1a19"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#c3c2b7" stroke-width="1.5"/></marker></defs><rect x="16" y="14" width="156" height="104" rx="6" fill="#2c2c2a" stroke="#383835"/><text x="28" y="38" fill="#f0efec" font-size="14" text-anchor="start" font-weight="600">Inputs</text><text x="28" y="58" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Character portraits</text><text x="28" y="75" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Voice sample</text><text x="28" y="92" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Line and timing</text><rect x="196" y="14" width="156" height="104" rx="6" fill="#2c2c2a" stroke="#383835"/><text x="208" y="38" fill="#f0efec" font-size="14" text-anchor="start" font-weight="600">Prompt</text><text x="208" y="58" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Six fixed sections:</text><text x="208" y="75" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">who, plot, what stays,</text><text x="208" y="92" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">action, sound, music</text><rect x="376" y="14" width="156" height="104" rx="6" fill="#2c2c2a" stroke="#383835"/><text x="388" y="38" fill="#f0efec" font-size="14" text-anchor="start" font-weight="600">H3 render</text><text x="388" y="58" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">12 steps on one GPU</text><text x="388" y="75" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Picture and speech</text><text x="388" y="92" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">come out together</text><rect x="556" y="14" width="156" height="104" rx="6" fill="#2c2c2a" stroke="#383835"/><text x="568" y="38" fill="#f0efec" font-size="14" text-anchor="start" font-weight="600">Clip</text><text x="568" y="58" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">24 fps, 1344x768</text><text x="568" y="75" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">A few seconds long</text><text x="568" y="92" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">with its own audio</text><path d="M174 66.0L193 66.0" stroke="#c3c2b7" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M354 66.0L373 66.0" stroke="#c3c2b7" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M534 66.0L553 66.0" stroke="#c3c2b7" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M634.0 120V162H454.0V122" stroke="#c3c2b7" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="544.0" y="180" fill="#c3c2b7" font-size="12" text-anchor="middle" font-weight="400">Longer scenes: the last 22 frames of each clip start the next one</text></svg>